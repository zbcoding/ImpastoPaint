name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  # The download button reads the version from configure.ac at build time, so a release whose
  # commit touches nothing under site/** still needs a rebuild - v0.2.1 shipped with the button
  # showing 0.2.0 until someone dispatched this by hand.
  #
  # Reached by build.yml's `site` job on every v* tag rather than by an `on: release` trigger:
  # build.yml creates the release with the default GITHUB_TOKEN, and GitHub starts no workflow
  # runs for events that token creates, so that trigger never fired once.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
