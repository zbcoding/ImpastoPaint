<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Scissors Select - magnetic scissors cutting along the selection edge -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnetic dashed selection edge -->
    <path d="M 2,4 Q 7,2.6 12,4 Q 17,5.4 22,4.3"
          stroke-width="1.15" stroke-dasharray="2,2" opacity="0.95"/>
    <!-- Crossing blades meeting at the edge and opening down into handles -->
    <path d="M 16.5,5 L 8.2,15.5" stroke-width="2.2"/>
    <path d="M 7.5,5 L 15.8,15.5" stroke-width="2.2"/>
    <!-- Open handle loops -->
    <circle cx="7.3" cy="17.6" r="2.7" stroke-width="1.8"/>
    <circle cx="16.7" cy="17.6" r="2.7" stroke-width="1.8"/>
  </g>
  <!-- Control node anchors on the selection edge -->
  <g fill="#ffffff">
    <rect x="1.1" y="3.1" width="1.8" height="1.8" rx="0.4"/>
    <rect x="11.1" y="3.1" width="1.8" height="1.8" rx="0.4"/>
    <rect x="21.1" y="3.4" width="1.8" height="1.8" rx="0.4"/>
  </g>
</svg>
