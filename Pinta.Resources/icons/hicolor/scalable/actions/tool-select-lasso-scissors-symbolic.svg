<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Scissors Select - magnetic scissors following edge -->
  <g fill="none" stroke="#bebebe" stroke-width="1.15"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnetic dashed edge with control anchors -->
    <path d="M 2,3.5 Q 7,2 12,3.5 Q 17,5 21,3.8"
          stroke-dasharray="2,2" opacity="0.95"/>
    <!-- Left handle loop -->
    <circle cx="7.5" cy="11" r="2.7"/>
    <!-- Right handle loop -->
    <circle cx="16.5" cy="11" r="2.7"/>
    <!-- Crossing blades -->
    <path d="M 9.0,13.3 L 17.2,22"/>
    <path d="M 15.0,13.3 L 6.8,22"/>
  </g>
  <!-- Control nodes / anchors -->
  <g fill="#bebebe">
    <rect x="1.1" y="2.6" width="1.8" height="1.8" rx="0.4"/>
    <rect x="11.1" y="2.6" width="1.8" height="1.8" rx="0.4"/>
    <rect x="20.1" y="2.9" width="1.8" height="1.8" rx="0.4"/>
  </g>
</svg>
